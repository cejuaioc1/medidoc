        let previousView = 'specialty-list';
        let isRestoringFromHistory = false;

        function getStoredData(key, defaultValue) {
            try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : defaultValue; }
            catch (e) { return defaultValue; }
        }

        function getCurrentState() { return { activeTab, currentView, detailDiseaseId, detailDilutionId, selectedCategory, previousView, editingId }; }
        function pushHistory() { if (isRestoringFromHistory) return; history.pushState(getCurrentState(), '', ''); }
        function restoreState(state) {
            if (state) {
                activeTab = state.activeTab || 'home';
                currentView = state.currentView || 'main';
                detailDiseaseId = state.detailDiseaseId || null;
                detailDilutionId = state.detailDilutionId || null;
                selectedCategory = state.selectedCategory || null;
                previousView = state.previousView || 'specialty-list';
                editingId = state.editingId || null;
            } else {
                activeTab = 'home'; currentView = 'main';
                detailDiseaseId = null; detailDilutionId = null;
                selectedCategory = null; previousView = 'specialty-list'; editingId = null;
            }
            render();
        }

        // ============================================================
        // CONTROLE DO BOTÃO VOLTAR DO CELULAR
        // ============================================================
        window.addEventListener('popstate', (e) => {
            const isMainView = currentView === 'main';
            const isToolbarTab = activeTab !== 'home';

            if (isMainView && isToolbarTab) {
                activeTab = 'home';
                currentView = 'main';
                detailDiseaseId = null;
                detailDilutionId = null;
                selectedCategory = null;
                previousView = 'specialty-list';
                editingId = null;
                history.pushState(getCurrentState(), '', '');
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            if (isMainView && !isToolbarTab) {
                window.close();
                history.pushState(getCurrentState(), '', '');
                return;
            }

            isRestoringFromHistory = true;
            restoreState(e.state);
            isRestoringFromHistory = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

                (d.category && d.category.toLowerCase().includes(query)) ||
                (d.notes && d.notes.toLowerCase().includes(query)) ||
                (d.abordagemGeral && d.abordagemGeral.toLowerCase().includes(query)) ||
                (d.prescriptions && d.prescriptions.some(p => { const val = typeof p === 'object' ? p.value : p; return val && val.toLowerCase().includes(query); }))
            ) : [];
            const filteredDilutions = query ? dilutions.filter(d =>
                (d.name && d.name.toLowerCase().includes(query)) ||
                (d.concentration && d.concentration.toLowerCase().includes(query)) ||
                (d.infusion && d.infusion.toLowerCase().includes(query))
            ) : [];
            const totalResults = filteredDiseases.length + filteredDilutions.length;
            container.innerHTML = `
                <div class="space-y-6">
                    <h2 class="font-bold text-slate-100 text-2xl">Pesquisar</h2>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500"><i class="fa-solid fa-magnifying-glass"></i></div>
                        <input type="text" id="search-input" value="${searchQuery}" oninput="handleSearch(event)" placeholder="Buscar por doença, medicamento, especialidade..." class="w-full pl-11 pr-10 py-3.5 bg-slate-900/60 backdrop-blur border border-slate-800 rounded-2xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-lg shadow-black/30 text-slate-100 placeholder-slate-500">
                        ${searchQuery ? `<button onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>` : ''}
                    </div>
                    ${!query ? `<div class="text-center py-12 text-slate-600"><i class="fa-solid fa-magnifying-glass text-4xl mb-3 block opacity-30"></i><p class="text-sm">Digite acima para buscar em todos os protocolos e diluições.</p></div>`
                    : totalResults === 0 ? `<div class="text-center py-12 bg-slate-900/40 rounded-3xl border border-dashed border-slate-800"><i class="fa-solid fa-face-frown text-4xl text-slate-700 mb-3 block"></i><p class="text-sm text-slate-400">Nenhum resultado para "<span class="font-bold text-slate-200">${searchQuery}</span>".</p></div>`
                    : `<div class="space-y-6">
                        ${filteredDiseases.length > 0 ? `<div>
                            <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500 mb-3 ml-1 flex items-center"><i class="fa-solid fa-book-medical mr-2 text-blue-400"></i> Doenças e Condutas (${filteredDiseases.length})</h3>
                            <div class="space-y-2">
                                ${filteredDiseases.map(d => `
                                    <button onclick="openDiseaseDetail(${d.id}, 'search')" class="w-full bg-slate-900/60 backdrop-blur rounded-xl border border-slate-800 px-3 py-2.5 flex items-center justify-between hover:bg-slate-800/60 hover:border-blue-500/50 transition group text-left">
                                        <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                                            <div class="w-6 h-6 bg-blue-500/10 text-blue-400 rounded-lg flex items-center justify-center shrink-0">
                                                <i class="fa-solid fa-disease text-[10px]"></i>
                                            </div>
                                            <div class="min-w-0 flex-1">
                                                <p class="text-sm font-semibold text-slate-100 truncate">${d.name}</p>
                                                <p class="text-[9px] text-blue-400 font-bold uppercase tracking-wider">${d.specialty} • ${d.category}</p>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-500 group-hover:text-blue-400 ml-2 shrink-0"></i>
                                    </button>
                                `).join('')}
                            </div>
                        </div>` : ''}
                        ${filteredDilutions.length > 0 ? `<div>
                            <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500 mb-3 ml-1 flex items-center"><i class="fa-solid fa-flask mr-2 text-emerald-400"></i> Diluições (${filteredDilutions.length})</h3>
                            <div class="space-y-2">
                                ${filteredDilutions.map(d => `
                                    <button onclick="openDilutionDetail(${d.id})" class="w-full bg-slate-900/60 backdrop-blur-xl rounded-2xl border border-slate-800 px-4 py-3 flex items-center justify-between text-left hover:border-emerald-500/50 transition group">
                                        <div class="flex items-center space-x-3 min-w-0 flex-1">
                                            <div class="w-8 h-8 bg-emerald-500/10 text-emerald-400 rounded-lg flex items-center justify-center shrink-0">
                                                <i class="fa-solid fa-flask text-xs"></i>
                                            </div>
                                            <div class="min-w-0 flex-1">
                                                <h4 class="font-bold text-slate-100 text-sm truncate">${d.name}</h4>
                                                <p class="text-[10px] text-slate-400 font-medium truncate">${d.concentration}</p>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-emerald-400 ml-2 shrink-0"></i>
                                    </button>
                                `).join('')}
                            </div>
                        </div>` : ''}
                    </div>`}
                </div>`;
        }
        function handleSearch(e) { searchQuery = e.target.value; renderPesquisar(document.getElementById('main-content')); const input = document.getElementById('search-input'); if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } }
        function clearSearch() { searchQuery = ''; renderPesquisar(document.getElementById('main-content')); }

        function renderSobre(container) {
            container.innerHTML = `
                <div class="space-y-6 text-center py-8">
                    <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-[2rem] flex items-center justify-center text-4xl mx-auto shadow-xl shadow-blue-500/20"><i class="fa-solid fa-stethoscope"></i></div>
                    <div><h2 class="font-extrabold text-slate-100 text-3xl">MediDoc</h2><p class="text-sm font-medium text-slate-400 mt-1 uppercase tracking-widest">Versão Pro</p></div>
                    <div class="bg-slate-900/60 backdrop-blur-xl p-6 rounded-3xl shadow-lg shadow-black/30 border border-slate-800 text-left space-y-4 max-w-sm mx-auto">
                        <div class="text-[11px] font-extrabold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">Informações do Autor</div>
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center text-slate-300 text-xl"><i class="fa-solid fa-user-doctor"></i></div>
                            <div><p class="text-base font-bold text-slate-100">Dr. Cudzanai Elias</p><p class="text-xs font-semibold text-blue-400">Médico de Clínica Geral</p></div>
                        </div>
                    </div>
                </div>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            history.replaceState(getCurrentState(), '', '');
            render();
        });
    </script>
</body>
</html>
